name: Daily data refresh

# The point of this job is not just to keep the page current. Each run commits a
# dated snapshot of what the City's record said that day, building a public
# archive of how this building's record changed over time. HPD's database only
# ever stores the current status; this is the only record of the previous one.

on:
  schedule:
    # 11:10 UTC = 6:10am America/New_York in winter, 7:10am in summer.
    # Cron here is always UTC; the snapshot itself is dated in New York time.
    - cron: '10 11 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/daily.yml'

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if:`, so mirror the
    # token into env at job level and test that instead. This is what lets the
    # deploy step self-skip cleanly when deployment has not been wired up yet.
    env:
      CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch today's data from NYC Open Data
        run: npm run fetch

      - name: Build the site
        run: npm run build

      - name: Leak check
        # This repository is public and sits inside a private one. Fail the run
        # rather than publish private material.
        run: npm run check

      - name: Commit today's snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change in the City's record today."
          else
            git commit -m "Data snapshot $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi

      # --- Deployment -------------------------------------------------------
      # The Pages project `530-parkside-nyc` is a DIRECT UPLOAD project, created
      # with `wrangler pages project create`. A direct-upload project cannot be
      # connected to a Git repository after the fact -- that choice is fixed at
      # creation -- so the only way to keep the live site current is for this
      # workflow to push the build to Cloudflare itself.
      #
      # To turn that on, once:
      #
      #   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
      #      -> use the "Edit Cloudflare Workers" template, or a custom token
      #      with Account / Cloudflare Pages / Edit.
      #   2. Add it to this repo:
      #        gh secret set CLOUDFLARE_API_TOKEN        # paste when prompted
      #        gh secret set CLOUDFLARE_ACCOUNT_ID       # paste when prompted
      #
      # Until then this step skips itself and the job still commits the daily
      # snapshot, so the archive keeps accumulating and nothing is lost -- the
      # published page just stops changing.
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN_PRESENT == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=530-parkside-nyc --branch=main
