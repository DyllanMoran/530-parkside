name: Daily data refresh

# The point of this job is not just to keep the page current. Each run commits a
# dated snapshot of what the City's record said that day, building a public
# archive of how this building's record changed over time. HPD's database only
# ever stores the current status; this is the only record of the previous one.

on:
  schedule:
    # 11:10 UTC = 6:10am America/New_York in winter, 7:10am in summer.
    # Cron here is always UTC; the snapshot itself is dated in New York time.
    - cron: '10 11 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/daily.yml'

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if:`, so mirror the
    # token into env at job level and test that instead. This is what lets the
    # deploy step self-skip cleanly when deployment has not been wired up yet.
    env:
      CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch today's data from NYC Open Data
        run: npm run fetch

      - name: Build the site
        run: npm run build

      - name: Leak check
        # This repository is public and sits inside a private one. Fail the run
        # rather than publish private material.
        run: npm run check

      - name: Commit today's snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change in the City's record today."
          else
            git commit -m "Data snapshot $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi

      # --- Deployment -------------------------------------------------------
      # Primary path: the Cloudflare Pages project is connected to this GitHub
      # repository, so Cloudflare rebuilds and redeploys on every push to main
      # -- including the data commit above. Nothing here needs to deploy, and
      # no Cloudflare credential exists anywhere in this repo. That is the point.
      #
      #   Cloudflare build settings:
      #     Build command      npm run build
      #     Output directory   dist
      #     Node version       from .node-version (22)
      #
      # Worth verifying once after setup: GitHub deliberately does not let a
      # push made with GITHUB_TOKEN trigger further GitHub Actions *workflows*.
      # That restriction does not extend to third-party GitHub App webhooks, so
      # Cloudflare should still rebuild on the bot's daily data commit. If a
      # daily snapshot ever lands without the live site changing, that
      # assumption was wrong -- fall back to the step below.
      #
      # Fallback path: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as
      # repository secrets and this step takes over. It skips itself silently
      # while they are unset, which is the normal state.
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN_PRESENT == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=530-parkside-nyc --branch=main
